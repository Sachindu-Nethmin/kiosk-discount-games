<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Classic BAR slot machine symbol -->
  <!-- License: CC0 / Public Domain - Original creation -->
  
  <!-- Outer rounded rectangle frame -->
  <rect x="5" y="5" width="190" height="110" rx="12" ry="12"
        fill="#1a1a2e" stroke="#c0a050" stroke-width="4"/>
  
  <!-- Inner border -->
  <rect x="12" y="12" width="176" height="96" rx="8" ry="8"
        fill="none" stroke="#c0a050" stroke-width="1.5" opacity="0.5"/>
  
  <!-- BAR text -->
  <text x="100" y="75" text-anchor="middle" dominant-baseline="central"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="56" fill="#f0c040" letter-spacing="6">
    BAR
  </text>
  
  <!-- Subtle gold highlight line at top -->
  <line x1="30" y1="20" x2="170" y2="20" stroke="#f0c040" stroke-width="1" opacity="0.3"/>
</svg>
